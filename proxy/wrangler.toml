name = "propertyroot-valuation-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Only these browser origins may call the proxy.
ALLOWED_ORIGINS = "https://yogibear1323.github.io"
# Per-address cache for successful lookups, seconds (30 days).
CACHE_TTL = "2592000"

# RENTCAST_API_KEY is a secret: `npx wrangler secret put RENTCAST_API_KEY` (never commit it).
