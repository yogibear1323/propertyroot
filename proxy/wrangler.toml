name = "propertyroot-valuation-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://yogibear1323.github.io,http://localhost:5173"

# BRIDGE_TOKEN is a secret: `npx wrangler secret put BRIDGE_TOKEN` (never commit it).

# Optional rate limiting (10 lookups / minute / IP):
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }
